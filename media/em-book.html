const W = H * (1748 / 2480);
const T = H * 0.06;           // spine thickness

const host = document.getElementById('book3d');

const maxAniso = renderer.capabilities.getMaxAnisotropy();
const loader = new THREE.TextureLoader();
function loadTex(url) {
  return new Promise((res, rej) => loader.load(url, t => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = maxAniso;
    res(t);
  }, undefined, rej));
}

// page edges: thin stacked sheets, drawn once on a canvas
function pageEdgeTexture(vertical) {
  const L = 1024, S = 8;
  const cv = document.createElement('canvas');
  cv.width = vertical ? L : S;
  cv.height = vertical ? S : L;
  const g = cv.getContext('2d');
  g.fillStyle = '#969694';
  g.fillRect(0, 0, cv.width, cv.height);
  for (let i = 0; i < L; i++) {
    const edge = Math.min(i, L - 1 - i) / L;          // 0 at the covers
    const ao = 1 - Math.max(0, 0.05 - edge) * 3.5;     // a touch darker near the covers
    const n = (0.9 + Math.random() * 0.1) * ao;
    const r = Math.round(150 * n), gg = Math.round(150 * n), b = Math.round(148 * n);
    g.fillStyle = `rgb(${r},${gg},${b})`;
    if (vertical) g.fillRect(i, 0, 1, S); else g.fillRect(0, i, S, 1);
  }
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}

const paper = new THREE.MeshStandardMaterial({ color: 0x00288f, roughness: 0.92 });
const coverEdge = new THREE.MeshStandardMaterial({ color: 0x00288f, roughness: 0.85 });
const edgeAlongU = new THREE.MeshStandardMaterial({ map: pageEdgeTexture(true), roughness: 0.95 });
const edgeAlongV = new THREE.MeshStandardMaterial({ map: pageEdgeTexture(false), roughness: 0.95 });

/* ------------------------------------------------------------------ */
/*  Hierarchy:  root > tilt > spin > book parts                         */
/* ------------------------------------------------------------------ */
const root = new THREE.Group();
const tilt = new THREE.Group();
const spin = new THREE.Group();
root.add(tilt); tilt.add(spin); scene.add(root);

const pickables = [];

function buildBook(front, back, spineTex) {
  const coverMat = map => new THREE.MeshStandardMaterial({ map, roughness: 0.58, metalness: 0 });

  // back cover
  const backCover = new THREE.Mesh(
    new THREE.BoxGeometry(W, H, C),
    [coverEdge, coverEdge, coverEdge, coverEdge, paper, coverMat(back)]
  );
  backCover.position.z = -T / 2 + C / 2;
  spin.add(backCover);

  // page block
  const pages = new THREE.Mesh(
    new THREE.BoxGeometry(W - INSET, H - INSET * 2, T - C * 2 - 0.002),
    [edgeAlongU, paper, edgeAlongV, edgeAlongV, paper, paper]
  );
  pages.position.x = -INSET / 2;
  spin.add(pages);

  // front cover, hinged at the spine
  const hinge = new THREE.Group();
  hinge.position.set(-W / 2, 0, T / 2 - C / 2);
  const frontCover = new THREE.Mesh(
    new THREE.BoxGeometry(W, H, C),
    [coverEdge, coverEdge, coverEdge, coverEdge, coverMat(front), paper]
  );
  frontCover.position.x = W / 2;
  hinge.add(frontCover);
  spin.add(hinge);

  // spine
  const spine = new THREE.Mesh(new THREE.PlaneGeometry(T, H), coverMat(spineTex));
  spine.rotation.y = -Math.PI / 2;
  spine.position.x = -W / 2 - 0.0008;
  spin.add(spine);

  pickables.push(backCover, pages, frontCover, spine);
  return hinge;
}

/* soft blob shadow */
let shadow;
if (CFG.shadow) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, 'rgba(0,0,0,0.55)');
  grd.addColorStop(0.45, 'rgba(0,0,0,0.22)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false, toneMapped: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = -H / 2 - 0.2;
  scene.add(shadow);
}

function resize() {
  const w = host.clientWidth || 1, h = host.clientHeight || 1;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const needH = 2.15, needW = 1.75;
  const dist = Math.max(needH / 2 / tanHalf, needW / 2 / tanHalf / camera.aspect);
  camera.position.set(0, 0, dist);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host);
resize();

/*  Motion: little damped springs make everything feel bouncy          */
/* ------------------------------------------------------------------ */
const spring = (x = 0) => ({ x, v: 0 });
function step(s, target, k, d, dt) {
  s.v += (k * (target - s.x) - d * s.v) * dt;
  s.x += s.v * dt;
}

const idle = { t: -1, from: 0, to: 0, hold: 1.0 };
const MODE = new URLSearchParams(location.search).get('spin');
const CONSTANT = MODE === 'constant' || MODE === 'hint';                            // steady turn, no pauses
const HINT = MODE === 'hint';                                                       // project page: rock left and right first, to show it can be turned
const HINT_TIME = 3.2;                                                              // seconds of rocking before the steady turn
let hintT = HINT ? 0 : -1, hintBase = 0;
addEventListener('message', e => { if (e.data === 'reset') { st.rotY = 0; st.velY = 0; hintT = HINT ? 0 : -1; } });
const CONSTANT_SPEED = 0.9;                                                         // rad/s

/* ------------------------------------------------------------------ */
/*  Pointer                                                            */
/* ------------------------------------------------------------------ */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let down = null;

function toNdc(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  return ndc;
}
function hitBook(e) {
  ray.setFromCamera(toNdc(e), camera);
  return ray.intersectObjects(pickables, false).length > 0;
}

const el = renderer.domElement;
el.addEventListener('pointermove', e => {
  st.inside = true;
  st.pointer.copy(toNdc(e));
  if (down) {
    const dx = e.clientX - down.x;
    if (!st.dragging && Math.abs(dx) > 4) { st.dragging = true; el.setPointerCapture(e.pointerId); }
    if (st.dragging) {
      hintT = -1;
      const now = performance.now();
      const ddx = e.clientX - down.lastX;
      const d = ddx * 0.011;
      st.rotY += d;
      const dt = Math.max(1, now - down.t) / 1000;
      st.velY = THREE.MathUtils.lerp(st.velY, d / dt, 0.6);
      down.lastX = e.clientX; down.t = now;
    }
  } else if (e.pointerType === 'mouse') {
    st.hovered = hitBook(e);
  }
  el.style.cursor = st.dragging ? 'grabbing' : (st.hovered ? 'grab' : 'default');
});
el.addEventListener('pointerdown', e => {
  down = { x: e.clientX, lastX: e.clientX, t: performance.now(), onBook: hitBook(e) };
});
const end = e => {
  down = null; st.dragging = false;
  el.style.cursor = st.hovered ? 'grab' : 'default';
};
el.addEventListener('pointerup', end);
el.addEventListener('pointercancel', () => { down = null; st.dragging = false; });
el.addEventListener('pointerleave', () => { st.inside = false; st.hovered = false; });

/* ------------------------------------------------------------------ */
/*  Loop                                                               */
/* ------------------------------------------------------------------ */
let hinge = null, running = false, last = 0, time = 0, visible = true;

function frame(now) {
  if (!running) return;
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000 || 0, 1 / 30);
  last = now; time += dt;

  // spin with inertia, easing back to the idle speed
  if (!st.dragging) {
    // idle turn paced like the Urban Encounters cover: a smooth half turn, then a short hold
    if (hintT >= 0) {                                   // gentle left and right sway, easing out into the turn
      hintT += dt;
      const k = Math.min(1, hintT / HINT_TIME);
      st.rotY = hintBase + Math.sin(hintT * Math.PI * 2 / 1.6) * 0.42 * (1 - k);
      if (hintT >= HINT_TIME) { hintT = -1; st.velY = 0; }
    }
    else if (Math.abs(st.velY) > 0.15) { st.velY *= Math.pow(0.12, dt); st.rotY += st.velY * dt; }
    else if (CONSTANT) { st.rotY += CONSTANT_SPEED * dt; st.velY = 0; }
    else if (Math.abs(st.velY) > 0.15) {                 // still coasting after a drag
      st.velY *= Math.pow(0.12, dt); st.rotY += st.velY * dt; idle.t = -1;
    } else {
      if (idle.t < 0) { idle.from = st.rotY; idle.to = (Math.floor(st.rotY / Math.PI) + 1) * Math.PI; idle.t = 0; idle.hold = 0; }
      if (idle.hold > 0) { idle.hold -= dt; }
      else {
        idle.t = Math.min(1, idle.t + dt / IDLE_TURN);
        const e = idle.t < .5 ? 4 * idle.t ** 3 : 1 - (-2 * idle.t + 2) ** 3 / 2;
        st.rotY = idle.from + (idle.to - idle.from) * e;
        if (idle.t >= 1) { idle.from = idle.to; idle.to += Math.PI; idle.t = 0; idle.hold = IDLE_HOLD; }
      }
      st.velY = 0;
    }
  }
  spin.rotation.y = st.rotY;

  if (shadow) {
    const h = Math.max(0, root.position.y);
    const s = 1 / (1 + h * 0.9);
    shadow.scale.set(1.75 * s, 0.62 * s, 1);
    shadow.material.opacity = 0.9 * s;
  }

  renderer.render(scene, camera);
}

function start() {
  if (running || !visible || document.hidden || !hinge) return;
  running = true; last = performance.now();
  requestAnimationFrame(frame);
}
function stop() { running = false; }

new IntersectionObserver(([en]) => { visible = en.isIntersecting; visible ? start() : stop(); }).observe(host);
document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));

Promise.all([loadTex(TEX.front), loadTex(TEX.back), loadTex(TEX.spine)]).then(([f, b, s]) => {
  hinge = buildBook(f, b, s);
  if (reduceMotion) { st.rotY = -0.5; st.velY = autoSpin; }
  renderer.compile(scene, camera);
  host.classList.add('ready');
  start();
});
</script>
</body>
</html>
